name: Build Sunset Docker Image

# 触发条件：当代码推送到 main 分支时运行
on:
  push:
    branches: [ "main"]

# 设置 GitHub 容器注册表 (GHCR) 权限
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码（重点：必须开启 submodules: recursive 以拉取子模块）
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 设置 Docker Buildx (支持高级构建功能)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录到 GitHub 镜像仓库 (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------
      # 4. 构建并推送【主项目】镜像
      # -----------------------------------------------------------
      - name: Build and push Sunset Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 镜像名称格式：ghcr.io/你的用户名/主项目名:latest
          tags: ghcr.io/void-jacklee/sunset:latest
          # --- 核心缓存配置 ---
          cache-from: type=gha,scope=sunset
          cache-to: type=gha,mode=max,scope=sunset

      # -----------------------------------------------------------
      # 5. 构建并推送【Submodule 子项目】镜像
      # -----------------------------------------------------------
      - name: Build and push Sunset-web Image
        uses: docker/build-push-action@v5
        with:
          # ⚠️请将下面的 my-submodule-folder 替换为你子模块的实际文件夹路径
          context: ./web 
          file: ./web/Dockerfile
          push: true
          # 镜像名称格式：ghcr.io/你的用户名/子项目名:latest
          tags: ghcr.io/void-jacklee/sunset-web:latest
          # --- 核心缓存配置 ---
          cache-from: type=gha,scope=sunset-web
          cache-to: type=gha,mode=max,scope=sunset-web